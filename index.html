<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Tugas</title>
  <style>
    :root {
      --navy: #081c2c;
      --navy-light: #12344a;
      --cream: #f8fafc;
      --ink: #102a43;
      --muted: #627d98;
      --accent: #f4b942;
      --accent-dark: #d89614;
      --line: #d9e2ec;
      --shadow: 0 24px 70px rgba(2, 12, 27, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        radial-gradient(circle at 15% 15%, rgba(244, 185, 66, 0.16), transparent 28%),
        linear-gradient(135deg, var(--navy-light), var(--navy) 68%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .wrap {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: minmax(270px, 0.86fr) minmax(0, 1.14fr);
      background: var(--cream);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .intro {
      position: relative;
      isolation: isolate;
      padding: 52px 36px;
      background: linear-gradient(155deg, var(--navy-light), var(--navy));
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 22px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }

    .intro::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 230px;
      height: 230px;
      top: -90px;
      left: -90px;
      border-radius: 50%;
      background: rgba(244, 185, 66, 0.12);
    }

    .intro p {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .intro p a { color: inherit; text-decoration: none; }

    .intro img {
      width: 176px;
      height: 176px;
      max-width: 100%;
      object-fit: cover;
      border: 5px solid rgba(244, 185, 66, 0.95);
      border-radius: 50%;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.3);
    }

    .intro h1 {
      max-width: 300px;
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.15rem);
      line-height: 1.18;
      letter-spacing: -0.035em;
    }

    nav {
      display: flex;
      align-items: center;
      padding: 44px 38px;
    }

    ul {
      list-style: none;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 0;
      padding: 0;
    }

    li:last-child:nth-child(odd) { grid-column: 1 / -1; }

    li a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      gap: 10px;
      padding: 14px 17px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      text-align: left;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.035em;
      box-shadow: 0 5px 14px rgba(16, 42, 67, 0.05);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    }

    li a::after {
      content: "→";
      color: var(--accent-dark);
      font-size: 1.15rem;
      transition: transform 0.22s ease;
    }

    li a:hover,
    li a:focus-visible {
      background: #fffaf0;
      border-color: var(--accent);
      box-shadow: 0 12px 24px rgba(16, 42, 67, 0.12);
      outline: none;
      transform: translateY(-3px);
    }

    li a:hover::after,
    li a:focus-visible::after { transform: translateX(4px); }

    @media (max-width: 720px) {
      body { padding: 18px 12px; }
      .wrap { grid-template-columns: 1fr; border-radius: 22px; }
      .intro { padding: 40px 24px; border-right: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
      nav { padding: 28px 18px; }
    }

    @media (max-width: 430px) {
      ul { grid-template-columns: 1fr; }
      li:last-child:nth-child(odd) { grid-column: auto; }
      li a { min-height: 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
