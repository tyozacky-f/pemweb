<!DOCTYPE html>
<html lang="en">
<head>
    <title>Formulir</title>
</head>
<body>
    <hr>
    <form>Formulir</form>
    <p>Nama Lengkap:</p>
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama" placeholder="Masukan nama"><br><br>

    <email for="email">Email:</email>
    <input type="email" id="email" name="email" placeholder="nama@gmail.com"><br><br>

    <label for="password">Password:</label>
    <input type="password" value="Kirim"><br><br>

    <label for="umur">Umur:</label>
    <input type="number" id="umur" name="umur"><br><br>

    <label for="tanggal larir">Tanggal Lahir:</label>
    <input type="date" id="tanggal lahir" name="tanggal lahir"><br><br>

    <input type="radio" id="laki-laki" name="jenis kelamin" value="laki-laki">
    <label for="laki">Laki-laki:</label><br>
    <input type="radio" id="perempuan" name="jenis kelamin" value="perempuan">
    <label for="perempuan">Perempuan</label><br><br>

    Hobi:<br>
    <input type="checkbox" id="coding" name="hobi" value="Coding">
    <label for="coding">Coding</label><br>
    <input type="checkbox" id="gaming" name="hobi" value="Gaming">
    <label for="gaming">Gaming</label><br>
    <input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
    <label for="olahraga">Olahraga</label><br><br>

    <label for="jurusan">Jurusan:</label><br>
    <select id="jurusan" name="jurusan">
    <option value="">-- Pilih Jurusan --</option>
    <option value="TI">Teknik Informatika</option>
    <option value="SI">Sistem Informasi</option>
    <option value="MI">Teknik Komputer Dan Jaringan</option>
    </select><br><br>

    <label for="alamat">Alamat:</label><br>
    <textarea id="alamat" name="alamat" rows="8" cols="30" placeholder="Masukkan alamat"></textarea><br><br>

    <label for="foto">Foto:</label><br>
    <input type="file" id="foto" name="foto"><br><br>

    <label for="website">Website:</label><br>
    <input type="url" id="website" name="website" placeholder="https://example.com"><br><br>

    <input type="submit" value="Kirim">
    <input type="reset" value="Reset">

  </form>
</body>
</html>
